<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modev Suite</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0a0e27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Modev Suite">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<style>
  :root{
    --bg:#0a0e27; --panel:#12163a; --panel-2:#181c44; --border:#2c3168;
    --text:#e7e9ee; --muted:#9aa0b0; --accent:#7c3aed; --accent-grad:linear-gradient(135deg,#6826fc,#d727f1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);}
  #tabbar{
    display:flex; gap:6px; padding:8px 10px; background:var(--panel);
    border-bottom:1px solid var(--border); overflow-x:auto;
  }
  .tab{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    background:var(--panel-2); color:var(--muted); border:1px solid var(--border);
    border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; min-height:40px;
  }
  .tab.active{background:var(--accent-grad); border-color:transparent; color:#fff; font-weight:600;}
  #frameHost{height:calc(100% - 57px); position:relative;}
  #toolFrame{width:100%; height:100%; border:none; display:block; background:var(--bg);}
  #loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; background:var(--bg); pointer-events:none; opacity:0; transition:opacity .15s;
  }
  #loading.show{opacity:1;}

  #hubTools{display:flex; align-items:center; gap:6px; margin-left:auto;}
  #consoleBtn{position:relative;}
  #consoleBadge{
    position:absolute; top:-4px; right:-4px; background:#ff8080; color:#1a1a1a;
    font-size:10px; font-weight:700; border-radius:8px; min-width:16px; height:16px;
    display:none; align-items:center; justify-content:center; padding:0 3px;
  }
  #consoleBadge.show{display:flex;}
  #consoleDrawer{
    position:fixed; left:0; right:0; bottom:0; height:38vh; background:#0e0f13;
    border-top:1px solid var(--border); z-index:80; transform:translateY(100%);
    transition:transform .2s ease; display:flex; flex-direction:column;
  }
  #consoleDrawer.open{transform:translateY(0);}
  #consoleHead{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border);}
  #consoleHead b{font-size:12px; color:var(--muted); flex:1;}
  #consoleLog{flex:1; overflow-y:auto; padding:6px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px;}
  .cline{padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05); white-space:pre-wrap; word-break:break-word;}
  .cline .tag{color:var(--muted); margin-right:6px;}
  .cline.log{color:var(--text);}
  .cline.info{color:#a78bfa;}
  .cline.warn{color:#f0c33c;}
  .cline.error{color:#ff8080;}
  .cline.hint{color:#f0c33c; padding-left:14px; font-style:italic; border-bottom:1px dashed rgba(255,255,255,.08);}

  button:active{transform:scale(.93);}
  .tab{transition:transform .1s ease, background .15s ease;}
  #toolFrame{opacity:0; transition:opacity .18s ease;}
  #toolFrame.loaded{opacity:1;}

  /* ---------- Splash screen ---------- */
  #splash{
    position:fixed; inset:0; z-index:300; background:#0a0e27;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; transition:opacity .38s ease, transform .42s cubic-bezier(.5,0,.75,0);
  }
  #splash.exit{opacity:0; transform:scale(1.12); pointer-events:none;}
  .splash-glow{
    position:absolute; width:130vw; height:130vw; border-radius:50%;
    background:radial-gradient(circle, rgba(124,58,237,.4), rgba(217,39,241,.15) 45%, transparent 70%);
    filter:blur(6px); animation:splashGlowMove 2.4s ease-in-out infinite alternate;
  }
  @keyframes splashGlowMove{
    0%{transform:translate(-18%,-12%) scale(.75) rotate(0deg); opacity:.55;}
    100%{transform:translate(14%,16%) scale(1.15) rotate(25deg); opacity:.95;}
  }
  .splash-tri{
    position:absolute; width:0; height:0; z-index:1; opacity:0;
    border-left:9px solid transparent; border-right:9px solid transparent; border-top:15px solid #b95bf0;
    animation:splashTriFloat 2.6s cubic-bezier(.34,1.56,.64,1) infinite;
  }
  @keyframes splashTriFloat{
    0%{opacity:0; transform:translateY(0) rotate(0deg) scale(.5);}
    15%{opacity:.8; transform:translateY(-14px) rotate(90deg) scale(1);}
    50%{opacity:.5; transform:translateY(10px) rotate(200deg) scale(.85);}
    85%{opacity:.8; transform:translateY(-8px) rotate(320deg) scale(1);}
    100%{opacity:0; transform:translateY(0) rotate(360deg) scale(.5);}
  }
  #splashMark{
    width:112px; height:auto; position:relative; z-index:2; opacity:0;
    transform:scale(.15) rotate(-30deg);
    animation:splashMarkIn .68s cubic-bezier(.34,1.56,.64,1) .05s forwards;
    filter:drop-shadow(0 14px 34px rgba(124,58,237,.55));
  }
  @keyframes splashMarkIn{
    0%{opacity:0; transform:scale(.15) rotate(-30deg);}
    55%{opacity:1; transform:scale(1.22) rotate(8deg);}
    75%{transform:scale(.92) rotate(-3deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }
  #splashWord{
    margin-top:16px; opacity:0; position:relative; z-index:2;
    transform:translateY(20px) scale(.9);
    animation:splashWordIn .46s cubic-bezier(.22,1,.36,1) .42s forwards;
    display:flex; align-items:baseline; gap:8px;
  }
  @keyframes splashWordIn{ to{opacity:1; transform:translateY(0) scale(1);} }
  #splashModev{font-size:30px; font-weight:800; color:#fff; letter-spacing:-.5px;}
  #splashSuite{font-size:13px; font-weight:700; letter-spacing:3px; background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .splash-bar{width:100px; height:3px; border-radius:2px; background:var(--border); margin-top:22px; overflow:hidden; position:relative; z-index:2;}
  .splash-bar::after{
    content:""; position:absolute; inset:0; width:40%; border-radius:2px; background:var(--accent-grad);
    animation:splashBarSweep 1.1s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes splashBarSweep{
    0%{transform:translateX(-120%);} 100%{transform:translateX(280%);}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-glow"></div>
  <div class="splash-tri" style="top:22%; left:28%; border-top-color:#7c3aed; animation-delay:.1s;"></div>
  <div class="splash-tri" style="top:30%; right:24%; border-top-color:#d727f1; animation-delay:.5s;"></div>
  <div class="splash-tri" style="bottom:26%; left:34%; border-top-color:#a78bfa; animation-delay:.9s;"></div>
  <div class="splash-tri" style="bottom:20%; right:30%; border-top-color:#7c3aed; animation-delay:1.3s;"></div>
  <img id="splashMark" src="icons/logo-mark-trim.png" alt="Modev">
  <div id="splashWord"><span id="splashModev">Modev</span><span id="splashSuite">SUITE</span></div>
  <div class="splash-bar"></div>
</div>

<div id="tabbar">
  <button class="tab" data-src="device-lab.html" data-label="Device Lab">📱 Device Lab</button>
  <button class="tab" data-src="github-uploader.html" data-label="GitHub"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="vertical-align:-3px;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</button>
  <button class="tab" data-src="code-editor.html" data-label="Code">💻 Code</button>
  <button class="tab" data-src="settings.html" data-label="Settings">⚙️ Settings</button>
  <div id="hubTools">
    <button id="consoleBtn" class="tab" title="Debug console">🐞<span id="consoleBadge">0</span></button>
  </div>
</div>

<div id="consoleDrawer">
  <div id="consoleHead">
    <b>Debug console — all tools</b>
    <button id="consoleClear" class="tab" style="padding:5px 10px;">Clear</button>
    <button id="consoleClose" class="tab" style="padding:5px 10px;">Close</button>
  </div>
  <div id="consoleLog"></div>
</div>

<div id="frameHost">
  <div id="loading">Loading…</div>
  <iframe id="toolFrame"></iframe>
</div>

<script>
(function(){
  "use strict";
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var frame = document.getElementById("toolFrame");
  var loading = document.getElementById("loading");
  var KEY = "hub.state.v1";

  function activate(src){
    tabs.forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-src") === src); });
    loading.classList.add("show");
    frame.classList.remove("loaded");
    // Clearing src first fully unloads the previous tool's memory before loading the next one.
    frame.src = "about:blank";
    setTimeout(function(){ frame.src = src; }, 30);
    try{ localStorage.setItem(KEY, src); }catch(e){}
  }
  frame.addEventListener("load", function(){
    if (frame.src.indexOf("about:blank") === -1){
      loading.classList.remove("show");
      frame.classList.add("loaded");
      firstLoadDone = true;
      maybeDismissSplash();
    }
  });

  var splash = document.getElementById("splash");
  var firstLoadDone = false;
  var minTimeDone = false;
  function maybeDismissSplash(){
    if (!splash || !firstLoadDone || !minTimeDone) return;
    splash.classList.add("exit");
    setTimeout(function(){ splash.remove(); }, 450);
  }
  setTimeout(function(){ minTimeDone = true; maybeDismissSplash(); }, 1350);
  // Safety net: never block the app for more than 3s even on a slow connection.
  setTimeout(function(){ firstLoadDone = true; minTimeDone = true; maybeDismissSplash(); }, 3000);

  tabs.forEach(function(t){
    t.addEventListener("click", function(){ activate(t.getAttribute("data-src")); });
  });

  var last = null;
  try{ last = localStorage.getItem(KEY); }catch(e){}
  activate(last && tabs.some(function(t){return t.getAttribute("data-src")===last;}) ? last : tabs[0].getAttribute("data-src"));

  // ---------------- Debug console (receives postMessage from every tool iframe) ----------------
  var consoleBtn = document.getElementById("consoleBtn");
  var consoleBadge = document.getElementById("consoleBadge");
  var consoleDrawer = document.getElementById("consoleDrawer");
  var consoleLogEl = document.getElementById("consoleLog");
  var consoleClose = document.getElementById("consoleClose");
  var consoleClear = document.getElementById("consoleClear");
  var unseenCount = 0;
  var MAX_LINES = 400;

  var HINTS = [
    [/failed to fetch|networkerror|load failed/i, "Check your internet connection — this tool needs one to load its libraries and talk to GitHub."],
    [/401|bad credentials|token.*(rejected|invalid)/i, "Your GitHub token looks invalid or expired — disconnect and reconnect with a fresh one."],
    [/403|rate limit/i, "GitHub API rate limit or missing token permission — wait a bit, or check the token's scope."],
    [/404/i, "Not found — double check the repo, branch, or file path."],
    [/422/i, "GitHub rejected the request content — often means the file already changed remotely; reload and retry."],
    [/importing binding name|failed to resolve module|dynamically imported module/i, "A library failed to load from its CDN — check your connection and reload this tool."],
    [/is not defined|cannot read propert(y|ies) of (undefined|null)/i, "Something loaded out of order — reloading this tool usually clears it."],
    [/quota|exceeded the quota/i, "Local storage is full — clear old drafts or unused data."]
  ];
  function hintFor(text){
    for (var i=0;i<HINTS.length;i++){ if (HINTS[i][0].test(text)) return HINTS[i][1]; }
    return null;
  }
  function addConsoleLine(entry){
    var line = document.createElement("div");
    line.className = "cline " + (entry.level || "log");
    var t = new Date(entry.time || Date.now());
    var hh = String(t.getHours()).padStart(2,"0"), mm = String(t.getMinutes()).padStart(2,"0"), ss = String(t.getSeconds()).padStart(2,"0");
    var tagSpan = document.createElement("span");
    tagSpan.className = "tag";
    tagSpan.textContent = hh + ":" + mm + ":" + ss + " · " + (entry.tool || "?");
    line.appendChild(tagSpan);
    var msgSpan = document.createElement("span");
    msgSpan.textContent = entry.text || "";
    line.appendChild(msgSpan);
    consoleLogEl.appendChild(line);
    if (entry.level === "error" || entry.level === "warn"){
      var hint = hintFor(entry.text || "");
      if (hint){
        var hintLine = document.createElement("div");
        hintLine.className = "cline hint";
        hintLine.textContent = "💡 " + hint;
        consoleLogEl.appendChild(hintLine);
      }
    }
    while (consoleLogEl.children.length > MAX_LINES) consoleLogEl.removeChild(consoleLogEl.firstChild);
    consoleLogEl.scrollTop = consoleLogEl.scrollHeight;
    if (!consoleDrawer.classList.contains("open")){
      unseenCount++;
      consoleBadge.textContent = unseenCount > 99 ? "99+" : String(unseenCount);
      consoleBadge.classList.add("show");
    }
  }
  window.addEventListener("message", function(e){
    if (e.data && e.data.__devConsole) addConsoleLine(e.data);
  });
  consoleBtn.addEventListener("click", function(){
    consoleDrawer.classList.toggle("open");
    if (consoleDrawer.classList.contains("open")){ unseenCount = 0; consoleBadge.classList.remove("show"); }
  });
  consoleClose.addEventListener("click", function(){ consoleDrawer.classList.remove("open"); });
  consoleClear.addEventListener("click", function(){ consoleLogEl.innerHTML = ""; });
})();
</script>

</body>
</html>
